
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HelpHub | Browse Donations</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

    <header class="header">
        <div class="container navbar">

            <a href="../index.html" class="logo">
                Help<span>Hub</span>
            </a>

            <a href="dashboard.html" class="btn">
                Back to Dashboard
            </a>

        </div>
    </header>

    <main class="dashboard-container">

        <section class="dashboard-heading">
            <h1>Available Donations</h1>
            <p>Find useful items shared by generous donors.</p>
        </section>

        <div id="donationsMessage">
            Loading available donations...
        </div>

        <section id="browseDonationsContainer"></section>

        <nav id="donationsPagination" aria-label="Donation pages"
            style="display:none; align-items:center; justify-content:center; gap:14px; margin:24px 0;">
            <button id="previousDonationsPage" class="btn" type="button" disabled>Previous</button>
            <span id="donationsPageInfo" aria-live="polite">Page 1 of 1</span>
            <button id="nextDonationsPage" class="btn" type="button" disabled>Next</button>
        </nav>

    </main>

    <script src="../js/config.js"></script>
    <script src="../js/browse-donations.js"></script>
    <script src="../js/back-button.js"></script>
</body>
</html>
