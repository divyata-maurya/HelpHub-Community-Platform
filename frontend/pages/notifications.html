<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notifications | HelpHub</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/notifications.css">
</head>

<body>

    <header class="header">
        <div class="container navbar">
            <a href="../index.html" class="logo">
                Help<span>Hub</span>
            </a>

            <div class="nav-buttons">
                <a href="dashboard.html" class="notification-back-link">Dashboard</a>
                <button id="logoutBtn" class="btn" type="button">Logout</button>
            </div>
        </div>
    </header>

    <main class="notifications-container">

        <section class="notifications-heading">
            <div>
                <h1>My Notifications</h1>
                <p>Stay updated about your donations and requests.</p>
            </div>

            <button id="markAllReadBtn" class="btn mark-all-btn" type="button">
                Mark All as Read
            </button>
        </section>

        <div class="notification-summary">
            <span id="totalNotifications">Total: 0</span>
            <span id="unreadNotifications">Unread: 0</span>
        </div>

        <p id="notificationMessage" class="notification-message" role="status">
            Loading notifications...
        </p>

        <section id="notificationsList" class="notifications-list"></section>

    </main>

    <script src="../js/config.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/back-button.js"></script>

</body>
</html>
