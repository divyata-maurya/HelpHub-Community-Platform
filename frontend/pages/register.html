
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HelpHub</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <a href="../index.html" class="logo">Help<span>Hub</span></a>

        <h1>Create Account</h1>
        <p class="subtitle">Join our community and make a difference.</p>

        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter phone number" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create password" required minlength="8">

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <label>Select Your Role</label>
            <select id="role" required>
                <option value="">Choose your role</option>
                <option value="donor">Donor</option>
                <option value="recipient">Recipient</option>
                <option value="ngo">NGO</option>
            </select>

            <button type="submit" class="auth-btn">Create Account</button>
            <p id="message" class="message" aria-live="polite"></p>
        </form>

        <p class="switch-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="../index.html" class="back-link">← Back to Home</a>
    </div>
</div>

<script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/back-button.js"></script>
</body>
</html>
