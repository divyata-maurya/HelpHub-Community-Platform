
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpHub | Submit Report</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/report.css">
</head>
<body>

<header class="header">
    <div class="container navbar">
        <a href="dashboard.html" class="logo">Help<span>Hub</span></a>
        <a href="dashboard.html" class="btn">Dashboard</a>
    </div>
</header>

<main class="report-container">
    <div class="report-heading">
        <h1>Submit a Report</h1>
        <p>Report suspicious activity or inappropriate content to HelpHub.</p>
    </div>

    <form id="reportForm" class="report-form">

        <div class="form-group">
            <label for="targetType">What do you want to report?</label>
            <select id="targetType" required>
                <option value="">Select report type</option>
                <option value="Donation">Donation</option>
                <option value="User">User</option>
            </select>
        </div>

        <div class="form-group">
            <label for="targetId">Target ID</label>
            <input
                type="text"
                id="targetId"
                placeholder="Enter Donation ID or User ID"
                required
            >
            <small>Enter the ID of the donation or user you want to report.</small>
        </div>

        <div class="form-group">
            <label for="reason">Reason for Report</label>
            <select id="reason" required>
                <option value="">Select a reason</option>
                <option value="FRAUD">Fraud</option>
                <option value="INAPPROPRIATE_CONTENT">Inappropriate Content</option>
                <option value="MISLEADING_INFORMATION">Misleading Information</option>
                <option value="SUSPICIOUS_ACTIVITY">Suspicious Activity</option>
                <option value="PROHIBITED_ITEM">Prohibited Item</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Additional Details</label>
            <textarea
                id="description"
                maxlength="1000"
                placeholder="Explain the issue (optional)..."
            ></textarea>
        </div>

        <button type="submit" class="report-btn">Submit Report</button>
        <p id="reportMessage"></p>

    </form>
</main>

<script src="../js/config.js"></script>
    <script src="../js/submit-report.js"></script>
    <script src="../js/back-button.js"></script>
    
</body>
</html>
